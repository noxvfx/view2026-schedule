<title>VIEW Conference 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --ink:#1c2128;
    --ink-soft:#57626d;
    --ink-faint:#8993a0;
    --paper:#f5f3ee;
    --paper-raised:#ffffff;
    --paper-sunken:#eae7de;
    --line:#ddd8cc;
    --line-strong:#c7c1b2;
    --accent:#bf4f1f;
    --accent-strong:#9c3f18;
    --accent-tint:#fbe6d9;
    --on-accent:#fff8f3;
    --conflict:#c81e3a;
    --conflict-tint:#fbe1e5;
    --conflict-ink:#7a0f22;
    --shadow: 0 1px 2px rgba(28,33,40,.05), 0 6px 16px -8px rgba(28,33,40,.18);

    --cat-talk-h:195; --cat-panel-h:225; --cat-keynote-h:46; --cat-workshop-h:150;
    --cat-masterclass-h:285; --cat-lab-h:256; --cat-portfolio-h:312; --cat-default-h:220;
    --sticky-offset:0px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eef1f4;
      --ink-soft:#aab3bd;
      --ink-faint:#78828d;
      --paper:#14171b;
      --paper-raised:#1c2027;
      --paper-sunken:#0f1215;
      --line:#2b303a;
      --line-strong:#3a404c;
      --accent:#e8783f;
      --accent-strong:#f3966a;
      --accent-tint:#3a2013;
      --on-accent:#1c0f06;
      --conflict:#ff6b7f;
      --conflict-tint:#3a1420;
      --conflict-ink:#ffb0bd;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px -8px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --ink:#eef1f4;
    --ink-soft:#aab3bd;
    --ink-faint:#78828d;
    --paper:#14171b;
    --paper-raised:#1c2027;
    --paper-sunken:#0f1215;
    --line:#2b303a;
    --line-strong:#3a404c;
    --accent:#e8783f;
    --accent-strong:#f3966a;
    --accent-tint:#3a2013;
    --on-accent:#1c0f06;
    --conflict:#ff6b7f;
    --conflict-tint:#3a1420;
    --conflict-ink:#ffb0bd;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px -8px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(64px + env(safe-area-inset-bottom));
  }
  h1,h2,h3{text-wrap:balance; margin:0;}
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  .display{font-family:'Big Shoulders Display', 'IBM Plex Sans', sans-serif;}
  button{font:inherit; color:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent-tint); color:var(--accent-strong);}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  /* ---------- header ---------- */
  .topbar{
    position:sticky; top:0; z-index:30;
    background:var(--paper); border-bottom:1px solid var(--line);
  }
  .topbar-inner{ max-width:1100px; margin:0 auto; padding:14px 16px 10px; }
  .brand-row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .wordmark{
    font-family:'Big Shoulders Display', sans-serif; font-weight:800;
    font-size:28px; letter-spacing:.01em; line-height:1;
    display:flex; align-items:baseline; gap:8px;
  }
  .wordmark .yr{color:var(--accent);}
  .venue-line{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .freshness{
    font-size:11px; color:var(--ink-faint); text-align:right; line-height:1.4;
  }
  .freshness a{ color:var(--ink-soft); text-decoration:underline; text-underline-offset:2px; }

  .day-scroller{
    display:flex; gap:8px; overflow-x:auto; padding:12px 16px 2px;
    max-width:1100px; margin:0 auto; scrollbar-width:none;
  }
  .day-scroller::-webkit-scrollbar{display:none;}
  .day-pill{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:60px; height:58px; border-radius:14px; border:1px solid var(--line);
    background:var(--paper-raised); cursor:pointer; position:relative;
  }
  .day-pill .dow{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); }
  .day-pill .num{ font-family:'Big Shoulders Display', sans-serif; font-weight:700; font-size:22px; line-height:1.05; color:var(--ink); }
  .day-pill.active{ background:var(--ink); border-color:var(--ink); }
  .day-pill.active .dow{ color:#fff8f3aa; }
  .day-pill.active .num{ color:#fff; }
  .day-pill .today-dot{
    position:absolute; top:5px; right:6px; width:6px; height:6px; border-radius:50%; background:var(--accent);
  }
  .day-pill.active .today-dot{ background:var(--accent-strong); }
  .day-pill.all-pill{ width:auto; padding:0 12px; }
  .day-pill.all-pill .dow{ font-size:11px; }

  .banner{
    max-width:1100px; margin:0 auto; padding:0 16px 10px;
  }
  .countdown-chip{
    display:inline-flex; align-items:center; gap:6px; background:var(--accent-tint); color:var(--accent-strong);
    border:0; border-radius:999px; padding:5px 12px 5px 10px; font-size:11.5px; font-weight:600; cursor:pointer;
    font-family:inherit;
  }
  .countdown-chip svg{ width:13px; height:13px; }

  /* ---------- filter row ---------- */
  .filter-row{
    max-width:1100px; margin:0 auto; padding:2px 16px 12px;
    display:flex; gap:8px; align-items:center;
  }
  .segmented{
    display:flex; background:var(--paper-sunken); border:1px solid var(--line); border-radius:10px; padding:2px;
    flex:1 1 auto;
  }
  .segmented button{
    flex:1; border:0; background:transparent; padding:7px 8px; border-radius:8px;
    font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .segmented button.active{ background:var(--paper-raised); color:var(--ink); box-shadow:var(--shadow); }
  .filter-btn{
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    border:1px solid var(--line); background:var(--paper-raised); border-radius:10px;
    padding:8px 12px; font-size:12.5px; font-weight:600; cursor:pointer; position:relative;
  }
  .filter-btn svg{width:15px; height:15px;}
  .filter-count{
    position:absolute; top:-6px; right:-6px; background:var(--accent); color:var(--on-accent);
    font-size:10px; font-weight:700; min-width:16px; height:16px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }

  /* ---------- tabs (bottom on mobile, top on wide) ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:var(--paper-raised); border-top:1px solid var(--line);
    display:flex; padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar button{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:9px 4px 8px; border:0; background:none; cursor:pointer; color:var(--ink-faint);
    font-size:10.5px; font-weight:600; position:relative;
  }
  .tabbar button svg{ width:21px; height:21px; }
  .tabbar button.active{ color:var(--accent); }
  .tab-badge{
    position:absolute; top:4px; right:calc(50% - 20px); background:var(--conflict); color:#fff;
    font-size:9.5px; font-weight:700; min-width:15px; height:15px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; padding:0 3px;
  }

  main{ max-width:1100px; margin:0 auto; padding:4px 16px 24px; }
  .view{ display:none; }
  .view.active{ display:block; }

  /* ---------- schedule list ---------- */
  .time-group{ margin-top:18px; }
  .time-heading{
    display:flex; align-items:baseline; gap:8px; margin-bottom:8px;
  }
  .time-heading .t{
    font-family:'Big Shoulders Display', sans-serif; font-weight:700; font-size:19px; color:var(--ink);
  }
  .time-heading .line{ flex:1; height:1px; background:var(--line); }

  .cards{ display:grid; grid-template-columns:1fr; gap:10px; }
  @media (min-width:720px){ .cards{ grid-template-columns:1fr 1fr; } }
  @media (min-width:1080px){ .cards{ grid-template-columns:1fr 1fr 1fr; } }

  .card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:12px;
    padding:12px 12px 12px 14px; position:relative; box-shadow:var(--shadow);
    border-left:4px solid var(--cat-color, var(--line-strong));
    display:flex; flex-direction:column; gap:7px;
  }
  .card-top{ display:flex; align-items:flex-start; gap:8px; justify-content:space-between; }
  .badges{ display:flex; flex-wrap:wrap; gap:6px; }
  .badge{
    font-size:10.5px; font-weight:700; letter-spacing:.02em; text-transform:uppercase;
    padding:3px 8px; border-radius:999px; background:var(--cat-tint, var(--paper-sunken)); color:var(--cat-color, var(--ink-soft));
  }
  .badge.addon{ background:var(--conflict-tint); color:var(--conflict-ink); }
  .fav-btn{
    border:0; background:none; cursor:pointer; padding:2px; flex:0 0 auto; color:var(--ink-faint);
    display:flex; align-items:center; justify-content:center;
  }
  .fav-btn svg{ width:21px; height:21px; }
  .fav-btn.active{ color:var(--accent); }
  .fav-btn.active svg{ fill:var(--accent); }

  .card-title{ font-size:15.5px; font-weight:650; line-height:1.32; color:inherit; text-decoration:none; display:block; }
  a.card-title{ cursor:pointer; }
  a.card-title:hover{ text-decoration:underline; text-decoration-color:var(--line-strong); }
  a.card-title svg{ width:12px; height:12px; margin-left:3px; vertical-align:2px; color:var(--ink-faint); }
  .card-meta{ display:flex; flex-wrap:wrap; row-gap:4px; column-gap:14px; font-size:12.5px; color:var(--ink-soft); }
  .card-meta span{ display:inline-flex; align-items:center; gap:5px; }
  .card-meta svg{ width:13px; height:13px; flex:0 0 auto; color:var(--ink-faint); }
  .card-speakers{ font-size:12.5px; color:var(--ink-soft); display:flex; align-items:flex-start; gap:5px; }
  .card-speakers svg{ width:13px; height:13px; margin-top:2px; flex:0 0 auto; color:var(--ink-faint); }

  .conflict-strip{
    display:flex; align-items:flex-start; gap:6px; background:var(--conflict-tint); color:var(--conflict-ink);
    border-radius:8px; padding:6px 8px; font-size:11.5px; font-weight:600; line-height:1.35;
  }
  .conflict-strip svg{ width:14px; height:14px; flex:0 0 auto; margin-top:1px; }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-faint);
  }
  .empty-state svg{ width:40px; height:40px; margin-bottom:10px; opacity:.6; }
  .empty-state button{
    margin-top:12px; border:1px solid var(--line-strong); background:var(--paper-raised);
    padding:8px 16px; border-radius:9px; font-weight:600; font-size:13px; cursor:pointer;
  }

  /* ---------- favorites summary ---------- */
  .fav-summary{
    display:flex; gap:10px; margin-bottom:14px;
  }
  .fav-stat{
    flex:1; background:var(--paper-raised); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; box-shadow:var(--shadow);
  }
  .fav-stat .n{ font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:26px; line-height:1; }
  .fav-stat.warn .n{ color:var(--conflict); }
  .fav-stat .lbl{ font-size:11px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.03em; margin-top:2px; }
  .day-section-heading{
    font-family:'Big Shoulders Display', sans-serif; font-weight:700; font-size:23px;
    margin:28px -16px 14px; padding:11px 16px; background:var(--paper-sunken);
    border-top:1px solid var(--line); border-bottom:3px solid var(--accent);
    scroll-margin-top:calc(var(--sticky-offset) + 10px);
    position:sticky; top:var(--sticky-offset); z-index:15;
    display:flex; align-items:baseline; gap:10px;
  }
  .day-section-heading .today-badge{
    font-family:'IBM Plex Sans', sans-serif; font-size:10.5px; font-weight:700; letter-spacing:.04em;
    text-transform:uppercase; color:var(--accent); background:var(--accent-tint);
    padding:2px 8px; border-radius:999px;
  }
  .schedule-day-block:first-child .day-section-heading{ margin-top:6px; }

  /* ---------- speakers ---------- */
  .search-wrap{
    position:relative; margin-bottom:14px;
  }
  .search-wrap svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-faint); }
  .search-wrap input{
    width:100%; padding:10px 12px 10px 34px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper-raised); color:var(--ink); font-size:14px; font-family:inherit;
  }
  .search-wrap input:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  .speaker-row{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin-bottom:8px; cursor:pointer;
  }
  .speaker-row-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .speaker-name{ font-weight:650; font-size:14.5px; }
  .speaker-role{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .speaker-chevron{ width:16px; height:16px; color:var(--ink-faint); transition:transform .15s; flex:0 0 auto; }
  .speaker-row.open .speaker-chevron{ transform:rotate(90deg); }
  .speaker-sessions{ display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  .speaker-row.open .speaker-sessions{ display:flex; }
  .speaker-session-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    font-size:12.5px; padding:6px 8px; border-radius:8px; background:var(--paper-sunken);
  }
  .speaker-session-item .go{ color:var(--accent); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.02em; white-space:nowrap; }
  .speaker-ext{ color:var(--ink-faint); }
  .letter-jump{ font-size:11px; color:var(--ink-faint); margin:16px 0 6px; font-weight:700; letter-spacing:.04em; }

  .legend{
    display:flex; flex-wrap:wrap; gap:10px; margin:4px 0 4px;
  }
  .legend-item{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-soft); }
  .legend-dot{ width:9px; height:9px; border-radius:50%; background:var(--dot-color); }

  .about-note{
    font-size:12px; color:var(--ink-faint); line-height:1.6; margin-top:26px; padding-top:16px; border-top:1px solid var(--line);
  }

  /* filter sheet */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(10,12,14,.4); z-index:50; display:none;
  }
  .sheet-backdrop.open{ display:block; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--paper-raised);
    border-radius:18px 18px 0 0; max-height:82vh; overflow-y:auto;
    padding:6px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .22s ease;
    box-shadow:0 -8px 30px rgba(0,0,0,.25);
  }
  .sheet-backdrop.open .sheet{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; background:var(--line-strong); border-radius:2px; margin:10px auto 12px; }
  .sheet h3{ font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin:16px 0 8px; }
  .sheet h3:first-of-type{ margin-top:2px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:7px; }
  .room-group{ margin-bottom:10px; }
  .room-group-label{ font-size:11px; color:var(--ink-faint); font-weight:600; margin:0 0 6px; }
  .chip{
    border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:7px 13px;
    font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-soft);
  }
  .chip.selected{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .chip .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }
  .sheet-actions{ display:flex; gap:10px; margin-top:20px; }
  .sheet-actions button{
    flex:1; padding:11px; border-radius:10px; font-weight:700; font-size:13.5px; cursor:pointer; border:1px solid var(--line);
  }
  .sheet-actions .apply{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .sheet-actions .reset{ background:var(--paper); color:var(--ink-soft); }
  .sheet-close{
    position:absolute; top:14px; right:14px; border:0; background:var(--paper-sunken); border-radius:50%;
    width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);
  }
  .sheet-close svg{ width:14px; height:14px; }

  @media (min-width:720px){
    .tabbar{ position:sticky; top:0; border-top:0; border-bottom:1px solid var(--line); }
    body{ padding-bottom:0; }
    .topbar{ position:static; }
    main{ padding-top:16px; }
  }
</style>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand-row">
      <div>
        <div class="wordmark">VIEW <span class="yr">2026</span></div>
        <div class="venue-line">27th Int'l Computer Graphics Conference · Torino, IT · 12–16 Oct</div>
      </div>
      <div class="freshness" id="freshness"></div>
    </div>
  </div>
  <div class="day-scroller" id="dayScroller"></div>
  <div class="banner" id="rangeBanner"></div>
  <div class="filter-row">
    <div class="segmented" id="ticketSeg">
      <button data-ticket="all">All Access</button>
      <button data-ticket="light">Light Pass</button>
    </div>
    <button class="filter-btn" id="openFilters">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2.3" fill="currentColor" stroke="none"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="16" cy="17" r="2.3" fill="currentColor" stroke="none"/></svg>
      Filters
      <span class="filter-count" id="filterCount" style="display:none;">0</span>
    </button>
  </div>
</div>

<main>
  <section class="view active" id="view-schedule"></section>
  <section class="view" id="view-favorites"></section>
  <section class="view" id="view-speakers">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.3" y2="16.3"/></svg>
      <input type="text" id="speakerListSearch" placeholder="Search speakers…" autocomplete="off">
    </div>
    <div id="speakersResults"></div>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="schedule" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><line x1="3" y1="9.5" x2="21" y2="9.5"/><line x1="8" y1="2.5" x2="8" y2="6.5"/><line x1="16" y1="2.5" x2="16" y2="6.5"/></svg>
    Schedule
  </button>
  <button data-tab="favorites">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.9-4.6-10.3-9.4C.2 8 1.6 4.6 5 3.8c2-.5 3.9.3 5 2 1.1-1.7 3-2.5 5-2 3.4.8 4.8 4.2 3.3 7.3C19.9 15.9 12 20.5 12 20.5z"/></svg>
    Favorites
    <span class="tab-badge" id="favBadge" style="display:none;">0</span>
  </button>
  <button data-tab="speakers">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c.8-3.6 3.4-5.6 6.5-5.6s5.7 2 6.5 5.6"/><circle cx="17.5" cy="8.5" r="2.5"/><path d="M15.7 14.8c2.6.2 4.6 2 5.2 5"/></svg>
    Speakers
  </button>
</nav>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <button class="sheet-close" id="sheetClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg></button>
    <div class="sheet-handle"></div>
    <h3>Session type</h3>
    <div class="chip-row" id="typeChips"></div>
    <h3>Room</h3>
    <div id="roomChipGroups"></div>
    <h3>Speaker</h3>
    <div class="search-wrap" style="margin-bottom:0;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.3" y2="16.3"/></svg>
      <input type="text" id="speakerSearchInput" placeholder="Search speaker name…" autocomplete="off">
    </div>
    <div class="sheet-actions">
      <button class="reset" id="resetFilters">Reset</button>
      <button class="apply" id="applyFilters">Show results</button>
    </div>
  </div>
</div>

<script type="application/json" id="schedule-data">__SCHEDULE_DATA__</script>
<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('schedule-data').textContent);
  var ROME_TZ = 'Europe/Rome';
  var SOURCE_PAGE = 'https://www.viewconference.it/assets/html/view_CET.html';
  var SITE_URL = 'https://www.viewconference.it/';

  var CATS = {
    'Talk':            { h: 195, label: 'Talk' },
    'Panel':           { h: 225, label: 'Panel' },
    'Keynote':         { h: 46,  label: 'Keynote' },
    'Workshop':        { h: 150, label: 'Workshop' },
    'Masterclass':     { h: 285, label: 'Masterclass' },
    'Lab':             { h: 256, label: 'Lab' },
    'Portfolio Reviews': { h: 312, label: 'Portfolio Reviews' }
  };
  function catMeta(type){
    return CATS[type] || { h: 220, label: type || 'Session' };
  }
  function catColor(type, dark){
    var m = catMeta(type);
    return 'hsl(' + m.h + ', ' + (dark ? '55%' : '48%') + ', ' + (dark ? '68%' : '38%') + ')';
  }
  function catTint(type, dark){
    var m = catMeta(type);
    return 'hsl(' + m.h + ', ' + (dark ? '38%' : '72%') + ', ' + (dark ? '20%' : '93%') + ')';
  }
  function isDark(){
    var t = document.documentElement.getAttribute('data-theme');
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  var ICONS = {
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.9-6.5-11A6.5 6.5 0 0 1 18.5 10c0 5.1-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>',
    users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="7.5" r="3"/><path d="M2 20c.7-3.4 3-5.2 6.5-5.2s5.8 1.8 6.5 5.2"/><circle cx="17" cy="8" r="2.3"/><path d="M15.5 14.9c2.4.2 4.2 1.8 4.8 4.5"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2 20.5h20L12 3.5z"/><line x1="12" y1="10" x2="12" y2="14.5"/><circle cx="12" cy="17.3" r=".4" fill="currentColor"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6-4.5-4.1 6-.7L12 3.5z"/></svg>',
    starSolid: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6-4.5-4.1 6-.7L12 3.5z"/></svg>',
    empty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><line x1="3" y1="9.5" x2="21" y2="9.5"/><path d="M8 14.5h3M8 17.5h6" stroke-linecap="round"/></svg>',
    ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg>'
  };

  /* ---------------- date helpers ---------------- */
  function romeTodayISO(){
    var fmt = new Intl.DateTimeFormat('en-CA', { timeZone: ROME_TZ, year:'numeric', month:'2-digit', day:'2-digit' });
    return fmt.format(new Date());
  }
  function dayIndex(iso){
    for (var i=0;i<DATA.days.length;i++) if (DATA.days[i].date === iso) return i;
    return -1;
  }
  function resolveTodaySection(){
    var today = romeTodayISO();
    var idx = dayIndex(today);
    if (idx >= 0) return { date: today, status: 'live', idx: idx };
    var first = DATA.days[0].date, last = DATA.days[DATA.days.length-1].date;
    if (today < first) return { date: first, status: 'before', today: today };
    return { date: last, status: 'after', today: today };
  }
  function fmtDayFull(iso){
    var d = new Date(iso + 'T12:00:00Z');
    return new Intl.DateTimeFormat('en-GB', { timeZone: ROME_TZ, weekday:'long', day:'numeric', month:'long' }).format(d);
  }
  function daysBetween(a,b){
    return Math.round((new Date(b+'T00:00:00Z') - new Date(a+'T00:00:00Z')) / 86400000);
  }

  /* ---------------- state ---------------- */
  var todaySection = resolveTodaySection();
  var urlParams = new URLSearchParams(window.location.search);
  var dateOverride = urlParams.get('date');
  var state = {
    dayFilter: (dateOverride && dayIndex(dateOverride) >= 0) ? dateOverride : null,
    ticket: 'all',
    types: new Set(),
    rooms: new Set(),
    speakerQuery: '',
    tab: 'schedule',
    speakerListQuery: '',
    openSpeaker: null
  };
  var draftFilters = null;
  var hasAutoScrolled = false;

  var favorites = new Set();
  try {
    var stored = JSON.parse(localStorage.getItem('view2026-favorites') || '[]');
    stored.forEach(function(id){ favorites.add(id); });
  } catch(e){}
  function saveFavorites(){
    try { localStorage.setItem('view2026-favorites', JSON.stringify(Array.from(favorites))); } catch(e){}
  }

  /* ---------------- data helpers ---------------- */
  function minutesOf(t){
    if (!t) return null;
    var m = /^(\d{2}):(\d{2})$/.exec(t);
    if (!m) return null;
    return parseInt(m[1],10)*60 + parseInt(m[2],10);
  }
  function overlaps(a,b){
    if (a.day !== b.day || a.id === b.id) return false;
    var s1=minutesOf(a.timeStart), e1=minutesOf(a.timeEnd), s2=minutesOf(b.timeStart), e2=minutesOf(b.timeEnd);
    if (s1==null||e1==null||s2==null||e2==null) return false;
    return s1 < e2 && s2 < e1;
  }
  function durationLabel(s){
    var s1 = minutesOf(s.timeStart), s2 = minutesOf(s.timeEnd);
    if (s1==null || s2==null || s2<=s1) return null;
    var mins = s2 - s1, h = Math.floor(mins/60), m = mins%60;
    if (h && m) return h + 'h ' + m + 'm';
    if (h) return h + 'h';
    return m + 'm';
  }
  function sessionById(id){
    return DATA.sessions.find(function(s){ return s.id === id; });
  }
  function conflictsFor(session){
    var favList = DATA.sessions.filter(function(s){ return favorites.has(s.id); });
    return favList.filter(function(o){ return overlaps(session,o); });
  }
  function allFavoriteConflictIds(){
    var favList = DATA.sessions.filter(function(s){ return favorites.has(s.id); });
    var ids = new Set();
    for (var i=0;i<favList.length;i++){
      for (var j=i+1;j<favList.length;j++){
        if (overlaps(favList[i], favList[j])) { ids.add(favList[i].id); ids.add(favList[j].id); }
      }
    }
    return ids;
  }
  function roomGroups(){
    var groups = [], seen = {};
    DATA.days.forEach(function(d){
      var key = d.rooms.slice().sort().join('|');
      if (!seen[key]){ seen[key] = { rooms: d.rooms, dayLabels: [] }; groups.push(seen[key]); }
      seen[key].dayLabels.push(d.label);
    });
    return groups.map(function(g){
      var label = g.dayLabels.length > 1 ? (g.dayLabels[0] + '–' + g.dayLabels[g.dayLabels.length-1]) : g.dayLabels[0];
      return { label: label, rooms: g.rooms };
    });
  }
  function typesPresent(){
    var set = new Set();
    DATA.sessions.forEach(function(s){ set.add(s.type || 'Session'); });
    var known = Object.keys(CATS).filter(function(k){ return set.has(k); });
    var unknown = Array.from(set).filter(function(k){ return !CATS[k]; });
    return known.concat(unknown);
  }
  function passingFilters(s, f){
    if (f.ticket === 'light' && s.ticketAccess === 'all') return false;
    if (f.types.size && !f.types.has(s.type || 'Session')) return false;
    if (f.rooms.size && !f.rooms.has(s.room)) return false;
    if (f.speakerQuery){
      var q = f.speakerQuery.toLowerCase();
      var hit = (s.speakers||[]).some(function(sp){ return sp.name.toLowerCase().indexOf(q) >= 0; });
      if (!hit) return false;
    }
    return true;
  }
  function activeFilterCount(){
    var n = 0;
    if (state.types.size) n += state.types.size;
    if (state.rooms.size) n += state.rooms.size;
    if (state.speakerQuery) n += 1;
    return n;
  }

  /* ---------------- rendering: header ---------------- */
  function renderFreshness(){
    var d = new Date(DATA.generatedAt);
    var time = new Intl.DateTimeFormat('en-GB', { timeZone: ROME_TZ, hour:'2-digit', minute:'2-digit', hour12:false }).format(d);
    var date = new Intl.DateTimeFormat('en-GB', { timeZone: ROME_TZ, day:'2-digit', month:'2-digit', year:'2-digit' }).format(d);
    document.getElementById('freshness').innerHTML =
      'Latest updated at ' + time + ' ' + date + ' CET<br><a href="' + SOURCE_PAGE + '" target="_blank" rel="noopener">official page</a>';
  }

  function renderDayPills(){
    var today = romeTodayISO();
    var allActive = !state.dayFilter;
    var html = '<button class="day-pill all-pill' + (allActive?' active':'') + '" data-day="">' +
      '<span class="dow">All</span><span class="num" style="font-size:15px;">Days</span></button>';
    html += DATA.days.map(function(d){
      var dt = new Date(d.date + 'T12:00:00Z');
      var dow = new Intl.DateTimeFormat('en-GB', { timeZone: ROME_TZ, weekday:'short' }).format(dt);
      var num = new Intl.DateTimeFormat('en-GB', { timeZone: ROME_TZ, day:'numeric' }).format(dt);
      var active = d.date === state.dayFilter;
      var isToday = d.date === today;
      return '<button class="day-pill' + (active?' active':'') + '" data-day="' + d.date + '">' +
        (isToday ? '<span class="today-dot"></span>' : '') +
        '<span class="dow">' + dow + '</span><span class="num">' + num + '</span></button>';
    }).join('');
    document.getElementById('dayScroller').innerHTML = html;
  }

  function renderCountdown(){
    var el = document.getElementById('rangeBanner');
    var first = DATA.days[0], last = DATA.days[DATA.days.length-1];
    var text;
    if (todaySection.status === 'before'){
      var nd = daysBetween(todaySection.today, first.date);
      text = 'VIEW 2026 starts in ' + nd + ' day' + (nd===1?'':'s');
    } else if (todaySection.status === 'after'){
      text = 'VIEW 2026 has wrapped for this year';
    } else {
      text = 'Live now — Day ' + (todaySection.idx+1) + ' of ' + DATA.days.length + ' · ' + fmtDayFull(todaySection.date);
    }
    el.innerHTML = '<button class="countdown-chip" id="countdownChip">' + ICONS.clock + text + '</button>';
    var chip = document.getElementById('countdownChip');
    if (chip) chip.addEventListener('click', function(){ scrollToDay(todaySection.date); });
  }
  function scrollToDay(date){
    var el = document.getElementById('day-section-' + date);
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  /* ---------------- card rendering ---------------- */
  function speakerNames(s){
    if (!s.speakers || !s.speakers.length) return 'Speaker TBA';
    return s.speakers.map(function(sp){ return sp.name; }).join(', ');
  }
  function timeLabel(s){
    if (!s.timeStart || !s.timeEnd) return 'Time TBA';
    var label = s.timeStart + '–' + s.timeEnd;
    var dur = durationLabel(s);
    return dur ? label + ' · ' + dur : label;
  }
  function renderCard(s){
    var dark = isDark();
    var color = catColor(s.type, dark), tint = catTint(s.type, dark);
    var isFav = favorites.has(s.id);
    var conflicts = isFav ? conflictsFor(s) : [];
    var conflictHtml = conflicts.length ? (
      '<div class="conflict-strip">' + ICONS.warn + '<span>Clashes with ' +
      conflicts.map(function(c){ return '“' + c.title + '” (' + timeLabel(c) + ')'; }).join(', ') +
      '</span></div>'
    ) : '';
    var addon = s.ticketAccess === 'separate' ? '<span class="badge addon">+ Separate ticket</span>' : '';
    var titleHtml = s.articleUrl
      ? '<a class="card-title" href="' + s.articleUrl + '" target="_blank" rel="noopener">' + s.title + ICONS.ext + '</a>'
      : '<div class="card-title">' + s.title + '</div>';
    return (
      '<article class="card" style="--cat-color:' + color + ';--cat-tint:' + tint + '" data-id="' + s.id + '">' +
        '<div class="card-top">' +
          '<div class="badges"><span class="badge">' + (s.type || 'Session') + '</span>' + addon + '</div>' +
          '<button class="fav-btn' + (isFav?' active':'') + '" data-fav="' + s.id + '" aria-label="Toggle favorite">' + (isFav ? ICONS.starSolid : ICONS.star) + '</button>' +
        '</div>' +
        titleHtml +
        '<div class="card-meta">' +
          '<span class="mono">' + ICONS.clock + timeLabel(s) + '</span>' +
          '<span>' + ICONS.pin + s.room + '</span>' +
        '</div>' +
        '<div class="card-speakers">' + ICONS.users + '<span>' + speakerNames(s) + '</span></div>' +
        conflictHtml +
      '</article>'
    );
  }

  function currentFilters(){
    return { ticket: state.ticket, types: state.types, rooms: state.rooms, speakerQuery: state.speakerQuery };
  }

  function timeGroupsHtml(sessions){
    sessions.sort(function(a,b){
      var ma = minutesOf(a.timeStart), mb = minutesOf(b.timeStart);
      if (ma==null && mb==null) return 0;
      if (ma==null) return 1;
      if (mb==null) return -1;
      if (ma !== mb) return ma - mb;
      return a.room.localeCompare(b.room);
    });
    var groups = [], lastTime = null;
    sessions.forEach(function(s){
      var key = s.timeStart || 'Time TBA';
      if (key !== lastTime){ groups.push({ time: key, items: [] }); lastTime = key; }
      groups[groups.length-1].items.push(s);
    });
    return groups.map(function(g){
      return '<div class="time-group">' +
        '<div class="time-heading"><span class="t mono">' + g.time + '</span><span class="line"></span></div>' +
        '<div class="cards">' + g.items.map(renderCard).join('') + '</div>' +
      '</div>';
    }).join('');
  }

  function renderSchedule(){
    var el = document.getElementById('view-schedule');
    var f = currentFilters();
    var today = romeTodayISO();
    var days = state.dayFilter ? DATA.days.filter(function(d){ return d.date === state.dayFilter; }) : DATA.days;
    var html = '', totalShown = 0;
    days.forEach(function(day){
      var sessions = DATA.sessions.filter(function(s){ return s.day === day.date && passingFilters(s, f); });
      if (!sessions.length) return;
      totalShown += sessions.length;
      var isToday = day.date === today;
      html += '<div class="schedule-day-block" id="day-section-' + day.date + '">' +
        '<h2 class="day-section-heading">' + fmtDayFull(day.date) + (isToday ? '<span class="today-badge">Today</span>' : '') + '</h2>' +
        timeGroupsHtml(sessions) +
      '</div>';
    });
    if (!totalShown){
      el.innerHTML = '<div class="empty-state">' + ICONS.empty +
        '<div>No sessions match your filters' + (state.dayFilter ? ' for ' + fmtDayFull(state.dayFilter) : '') + '.</div>' +
        '<button id="clearFromEmpty">Clear filters</button></div>';
      var btn = document.getElementById('clearFromEmpty');
      if (btn) btn.addEventListener('click', function(){ resetFilterState(); });
      return;
    }
    el.innerHTML = html;
    if (!hasAutoScrolled){
      hasAutoScrolled = true;
      var target = document.getElementById('day-section-' + todaySection.date);
      if (target) setTimeout(function(){ target.scrollIntoView({ behavior:'auto', block:'start' }); }, 0);
    }
  }

  function renderFavorites(){
    var el = document.getElementById('view-favorites');
    var favSessions = DATA.sessions.filter(function(s){ return favorites.has(s.id); });
    favSessions.sort(function(a,b){
      if (a.day !== b.day) return a.day.localeCompare(b.day);
      var ma = minutesOf(a.timeStart), mb = minutesOf(b.timeStart);
      return (ma==null?9999:ma) - (mb==null?9999:mb);
    });
    if (!favSessions.length){
      el.innerHTML = '<div class="empty-state">' + ICONS.star.replace('currentColor','var(--ink-faint)') +
        '<div>No favorites yet.<br>Tap the star on any session to save it here.</div></div>';
      return;
    }
    var conflictIds = allFavoriteConflictIds();
    var byDay = {};
    var order = [];
    favSessions.forEach(function(s){
      if (!byDay[s.day]){ byDay[s.day] = []; order.push(s.day); }
      byDay[s.day].push(s);
    });
    var html = '<div class="fav-summary">' +
      '<div class="fav-stat"><div class="n">' + favSessions.length + '</div><div class="lbl">Saved</div></div>' +
      '<div class="fav-stat' + (conflictIds.size ? ' warn' : '') + '"><div class="n">' + conflictIds.size + '</div><div class="lbl">In conflict</div></div>' +
    '</div>';
    html += order.map(function(day){
      var d = DATA.days.find(function(x){ return x.date === day; });
      return '<div class="day-section-heading">' + (d ? fmtDayFull(day) : day) + '</div>' +
        '<div class="cards">' + byDay[day].map(function(s){ return renderCard(s); }).join('') + '</div>';
    }).join('');
    el.innerHTML = html;
  }

  function renderSpeakers(){
    var el = document.getElementById('speakersResults');
    var q = state.speakerListQuery.toLowerCase();
    var list = DATA.speakers.filter(function(sp){ return !q || sp.name.toLowerCase().indexOf(q) >= 0; });
    if (!list.length){
      el.innerHTML = '<div class="empty-state">' + ICONS.empty + '<div>No speaker matches “' + state.speakerListQuery + '”.</div></div>';
      return;
    }
    var body = list.map(function(sp){
      var open = state.openSpeaker === (sp.url || sp.name);
      var sessions = sp.sessionIds.map(sessionById).filter(Boolean).sort(function(a,b){
        if (a.day !== b.day) return a.day.localeCompare(b.day);
        return (minutesOf(a.timeStart)||9999) - (minutesOf(b.timeStart)||9999);
      });
      var key = sp.url || sp.name;
      return '<div class="speaker-row' + (open?' open':'') + '" data-speaker="' + key.replace(/"/g,'&quot;') + '">' +
        '<div class="speaker-row-head">' +
          '<div><div class="speaker-name">' + sp.name + '</div>' +
          '<div class="speaker-role">' + (sp.roles[0] || '') + '</div></div>' +
          '<svg class="speaker-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>' +
        '</div>' +
        '<div class="speaker-sessions">' +
          (sp.roles.length > 1 ? '<div class="speaker-ext" style="margin-bottom:4px;">' + sp.roles.join(' · ') + '</div>' : '') +
          sessions.map(function(s){
            var d = DATA.days.find(function(x){ return x.date === s.day; });
            return '<div class="speaker-session-item" data-goto="' + s.id + '">' +
              '<span>' + s.title + '<br><span class="speaker-ext">' + (d?d.label:s.day) + ' · ' + timeLabel(s) + ' · ' + s.room + '</span></span>' +
              '<span class="go">View →</span>' +
            '</div>';
          }).join('') +
          (sp.url ? '<div style="margin-top:2px;"><a href="' + sp.url + '" target="_blank" rel="noopener" class="speaker-ext" style="display:inline-flex;align-items:center;gap:4px;">Profile ' + ICONS.ext + '</a></div>' : '') +
        '</div>' +
      '</div>';
    }).join('');
    el.innerHTML = body;

    el.querySelectorAll('.speaker-row').forEach(function(row){
      row.addEventListener('click', function(e){
        if (e.target.closest('[data-goto]')) return;
        if (e.target.closest('a')) return;
        var key = row.getAttribute('data-speaker');
        state.openSpeaker = state.openSpeaker === key ? null : key;
        renderSpeakers();
      });
    });
    el.querySelectorAll('[data-goto]').forEach(function(item){
      item.addEventListener('click', function(e){
        e.stopPropagation();
        var id = item.getAttribute('data-goto');
        var s = sessionById(id);
        if (!s) return;
        resetFilterState(false);
        switchTab('schedule');
        renderAll();
        setTimeout(function(){
          var card = document.querySelector('.card[data-id="' + id + '"]');
          if (card){ card.scrollIntoView({ behavior:'smooth', block:'center' }); card.style.outline = '2px solid var(--accent)'; setTimeout(function(){ card.style.outline=''; }, 1600); }
        }, 50);
      });
    });
  }
  document.getElementById('speakerListSearch').addEventListener('input', function(e){
    state.speakerListQuery = e.target.value;
    renderSpeakers();
  });

  /* ---------------- filter sheet ---------------- */
  function openSheet(){
    draftFilters = { types: new Set(state.types), rooms: new Set(state.rooms), speakerQuery: state.speakerQuery };
    renderSheet();
    document.getElementById('sheetBackdrop').classList.add('open');
  }
  function closeSheet(){ document.getElementById('sheetBackdrop').classList.remove('open'); }
  function renderSheet(){
    var dark = isDark();
    document.getElementById('typeChips').innerHTML = typesPresent().map(function(t){
      var sel = draftFilters.types.has(t);
      var dot = 'background:' + catColor(t, dark) + ';';
      return '<button class="chip' + (sel?' selected':'') + '" data-type="' + t.replace(/"/g,'&quot;') + '"><span class="dot" style="' + dot + '"></span>' + t + '</button>';
    }).join('');
    document.getElementById('roomChipGroups').innerHTML = roomGroups().map(function(g){
      return '<div class="room-group"><div class="room-group-label">' + g.label + '</div><div class="chip-row">' +
        g.rooms.map(function(r){
          var sel = draftFilters.rooms.has(r);
          return '<button class="chip' + (sel?' selected':'') + '" data-room="' + r.replace(/"/g,'&quot;') + '">' + r + '</button>';
        }).join('') +
      '</div></div>';
    }).join('');
    document.getElementById('speakerSearchInput').value = draftFilters.speakerQuery;

    document.querySelectorAll('#typeChips .chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        var t = chip.getAttribute('data-type');
        if (draftFilters.types.has(t)) draftFilters.types.delete(t); else draftFilters.types.add(t);
        renderSheet();
      });
    });
    document.querySelectorAll('#roomChipGroups .chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        var r = chip.getAttribute('data-room');
        if (draftFilters.rooms.has(r)) draftFilters.rooms.delete(r); else draftFilters.rooms.add(r);
        renderSheet();
      });
    });
  }
  function resetFilterState(rerender){
    state.types = new Set(); state.rooms = new Set(); state.speakerQuery = '';
    state.ticket = 'all'; state.dayFilter = null;
    if (rerender !== false) renderAll();
  }

  /* ---------------- tabs ---------------- */
  function switchTab(tab){
    state.tab = tab;
    document.querySelectorAll('.tabbar button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab') === tab); });
    document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('active', v.id === 'view-' + tab); });
    window.scrollTo({ top: 0 });
  }

  /* ---------------- sticky day-header offset ---------------- */
  function updateStickyOffset(){
    var isDesktop = window.matchMedia('(min-width:720px)').matches;
    var el = document.querySelector(isDesktop ? '.tabbar' : '.topbar');
    var h = el ? el.getBoundingClientRect().height : 0;
    document.documentElement.style.setProperty('--sticky-offset', h + 'px');
  }
  window.addEventListener('resize', updateStickyOffset);

  /* ---------------- master render ---------------- */
  function renderAll(){
    renderDayPills();
    renderCountdown();
    document.querySelectorAll('#ticketSeg button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-ticket') === state.ticket); });
    var count = activeFilterCount();
    var badge = document.getElementById('filterCount');
    if (count){ badge.style.display='flex'; badge.textContent = count; } else { badge.style.display='none'; }
    renderSchedule();
    renderFavorites();
    renderSpeakers();
    var favBadge = document.getElementById('favBadge');
    var conflictCount = allFavoriteConflictIds().size;
    if (conflictCount){ favBadge.style.display='flex'; favBadge.textContent = conflictCount; } else { favBadge.style.display='none'; }
    updateStickyOffset();
  }

  /* ---------------- event wiring ---------------- */
  document.getElementById('dayScroller').addEventListener('click', function(e){
    var btn = e.target.closest('.day-pill');
    if (!btn) return;
    var day = btn.getAttribute('data-day');
    state.dayFilter = (!day || day === state.dayFilter) ? null : day;
    hasAutoScrolled = true;
    renderAll();
  });
  document.getElementById('ticketSeg').addEventListener('click', function(e){
    var btn = e.target.closest('button');
    if (!btn) return;
    state.ticket = btn.getAttribute('data-ticket');
    renderAll();
  });
  document.getElementById('openFilters').addEventListener('click', openSheet);
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  document.getElementById('sheetBackdrop').addEventListener('click', function(e){ if (e.target === this) closeSheet(); });
  document.getElementById('speakerSearchInput').addEventListener('input', function(e){ draftFilters.speakerQuery = e.target.value; });
  document.getElementById('resetFilters').addEventListener('click', function(){
    draftFilters = { types: new Set(), rooms: new Set(), speakerQuery: '' };
    renderSheet();
  });
  document.getElementById('applyFilters').addEventListener('click', function(){
    state.types = draftFilters.types; state.rooms = draftFilters.rooms; state.speakerQuery = draftFilters.speakerQuery;
    closeSheet();
    renderAll();
  });
  document.querySelectorAll('.tabbar button').forEach(function(b){
    b.addEventListener('click', function(){ switchTab(b.getAttribute('data-tab')); });
  });
  document.addEventListener('click', function(e){
    var favBtn = e.target.closest('[data-fav]');
    if (!favBtn) return;
    var id = favBtn.getAttribute('data-fav');
    if (favorites.has(id)) favorites.delete(id); else favorites.add(id);
    saveFavorites();
    renderAll();
  });
  if (window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderAll);
  }

  renderFreshness();
  renderAll();
})();
</script>
