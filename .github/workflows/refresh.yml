name: Refresh schedule

on:
  # Schedule removed after VIEW 2026 ended (archived). To revive next year,
  # restore the cron entries from git history (before the 'Archive' commit)
  # and update the dates.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install beautifulsoup4==4.15.0 lxml==6.1.3

      - run: python scripts/refresh.py

      - name: Commit and push if the schedule changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-refresh schedule data"
            git push
          fi
